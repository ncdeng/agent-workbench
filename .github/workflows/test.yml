name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  pure-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    env:
      OPENAI_API_KEY: mock-key-for-ci
      OPENAI_MODEL: gpt-4o-mini
      OPENAI_BASE_URL: ""
      CST_INSTALL_ROOT: ""
      CST_EXECUTABLE_PATHS: ""
      FARFIELD_TEMPLATE_R0D_SOURCE: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: integrations/pi_agent_core/package-lock.json

      - name: Install Pi sidecar
        working-directory: integrations/pi_agent_core
        run: npm ci

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,web,report]

      - name: Run offline Python tests
        run: |
          python -m pytest -m "not cst" -v --tb=short

      - name: Run fake CST benchmark smoke
        run: |
          python benchmarks/agent_ablation_runner.py --cases 5 --max-rounds 4 --assert-thresholds --output /tmp/agent_ablation_fake_cst_smoke.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: frontend
        run: npm run e2e
